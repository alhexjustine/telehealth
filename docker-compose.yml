services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telehealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telehealth}
      POSTGRES_DB: ${POSTGRES_DB:-telehealth}
    volumes:
      - telehealth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-telehealth} -d ${POSTGRES_DB:-telehealth}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telehealth}:${POSTGRES_PASSWORD:-telehealth}@postgres:5432/${POSTGRES_DB:-telehealth}?schema=public
      PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      # Local-only defaults for the pre-provisioned admin account. Override in
      # `.env` for anything beyond local development; see README.md.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@telehealth.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe-Admin-2026}
      # Loads the fictional demo dataset on first startup so the app is explorable immediately.
      # Set to false in `.env` to start from an empty database instead.
      DEMO_DATA: ${DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  telehealth_pg_data:
