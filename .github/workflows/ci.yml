name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: telehealth
          POSTGRES_PASSWORD: telehealth
          POSTGRES_DB: telehealth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telehealth -d telehealth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://telehealth:telehealth@localhost:5432/telehealth_test?schema=public
      # Deliberately not NODE_ENV=test here: apps/api/test/setup-env.ts already defaults it to
      # "test" for the e2e/unit test steps (Jest/Vitest also default it themselves), and setting
      # it job-wide instead leaked into the "Build" step below — Vite only forces a production
      # bundle when NODE_ENV isn't already set in the shell, so `vite build` shipped React's and
      # TanStack Query's development code (full console-warning URLs and all), which then failed
      # "Check the web build has no external references".
      APP_ORIGINS: http://localhost:8080,http://localhost:5173
      COOKIE_SECURE: 'false'
      SESSION_IDLE_MINUTES: '120'
      SESSION_ABSOLUTE_HOURS: '12'
      REMINDERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Regenerate OpenAPI document and client, then check for drift
        run: |
          pnpm openapi:generate
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts

      - name: Regenerate the data model ER diagram, then check for drift
        run: |
          pnpm docs:generate-data-model
          git diff --exit-code -- docs/architecture/_generated-erd.md

      - name: Unit tests
        run: pnpm test

      - name: Scenario-to-test traceability
        run: pnpm traceability

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Check the web build has no external references
        run: pnpm --filter web run check:assets

      - name: Docs build
        run: pnpm docs:build

      - name: OpenSpec validate
        run: pnpm exec openspec validate --all --strict

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Build and start the stack (docker-compose.e2e.yml override)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d

      - name: Wait for the stack to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Stack is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not report healthy in time." >&2
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1

      - name: Run the browser test suite
        run: pnpm --filter e2e exec playwright test

      - name: Upload the Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
