name: Deploy to Fly.io

# Runs after CI finishes on main, and only deploys if CI passed — see
# docs/guide/fly-deploy.md for the one-time Fly setup (apps, Postgres,
# secrets) this workflow builds on top of. Deploys the API first (its
# docker-entrypoint.sh runs migrations/admin-provisioning/demo-seed on boot)
# so the database is ready before the web app's health checks expect a
# working /api/ proxy target.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the API
        run: flyctl deploy --config fly.api.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the web app
        run: flyctl deploy --config fly.web.toml --dockerfile apps/web/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
