# Fly.io app config for the NestJS API (bonus cloud deployment — see CLAUDE.md's "Bonus cloud
# deployment" and docs/deploy/fly.md). Deploy from the repo root so the build context matches
# docker-compose.yml's `context: .`:
#   fly deploy --config fly.api.toml --dockerfile apps/api/Dockerfile
#
# `app` below is a placeholder — Fly app names are globally unique, so this is rewritten to the
# real name at `fly launch`/`fly apps create` time. See docs/deploy/fly.md for the full sequence.
app = "hey-doc-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"
  # Same-origin only: the browser only ever talks to the web app's public hostname (nginx proxies
  # /api and /socket.io internally over Fly's 6PN network — see fly.web.toml). Rewritten to the
  # real web app's https://<name>.fly.dev origin during setup.
  APP_ORIGINS = "https://hey-doc-web.fly.dev"
  COOKIE_SECURE = "true"
  SESSION_IDLE_MINUTES = "120"
  SESSION_ABSOLUTE_HOURS = "12"
  REMINDERS_ENABLED = "true"
  ADMIN_EMAIL = "admin@telehealth.local"
  # Demo dataset on by default so the deployed app is explorable immediately, same as
  # docker-compose.yml. Set to "false" (fly secrets/env update) to start from an empty database.
  DEMO_DATA = "true"
  JOIN_WINDOW_DISABLED = "false"
  # DATABASE_URL, ADMIN_PASSWORD, and JITSI_ROOM_SECRET are set via `fly secrets set` instead —
  # see docs/deploy/fly.md. Never put real credentials in this committed file.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
